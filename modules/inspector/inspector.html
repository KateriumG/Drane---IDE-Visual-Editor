  <div id="inspector">
    <h3>Inspector</h3>

    <label>Nombre</label>
    <input id="prop-name" type="text">

    <br>
    <label>Texto</label>
    <input id="prop-text" type="text">

    <label>Borde</label>
    <input id="prop-border" type="checkbox">

    <label>Color Fondo</label>
    <input id="prop-bg" type="color">

    <label>Color Texto</label>
    <input id="prop-color" type="color">
    <br>
    <label>Border Radius</label>
    <input id="prop-radius" type="number" min="0" value="0">
  </div>
